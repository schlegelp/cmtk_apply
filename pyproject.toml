[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cmtk-apply"
version = "0.1.0"
description = "Python library to read and apply CMTK transformations (affine and spline warps)"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Philipp Schlegel", email = "pms70@cam.ac.uk"}
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.19.0",
    "scipy>=1.5.0",
    "numba>=0.57.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov",
]

[project.urls]
Repository = "https://github.com/example/cmtk-apply"
Documentation = "https://github.com/example/cmtk-apply"
